<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human × Machine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Human and machine, reaching for each other.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark screen. The canvas is the whole image; text sits in the four corners, small. */
:root {
  --bg: #060707;
  --ink: #e9e7e2;
  --dim: #8b8a85;
  --faint: #4b4b48;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.hud {
  position: fixed; inset: 0;
  pointer-events: none;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 22px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 700px) {
  .hud { padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); padding-top: 30px; padding-bottom: 32px; }
}
.row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.label { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
.label.faint { color: var(--faint); }
.top { align-items: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.name { color: var(--ink); letter-spacing: 0.32em; }
.links { display: flex; gap: 22px; pointer-events: auto; }
.links a, .links .soon { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); text-decoration: none; padding-block: 6px; }
.links a::before { content: "["; opacity: 0; margin-right: 0.35em; transition: opacity .4s ease; }
.links a::after { content: "]"; opacity: 0; margin-left: 0.15em; transition: opacity .4s ease; }
.links a:hover, .links a:focus-visible { color: var(--ink); outline: none; }
.links a:hover::before, .links a:hover::after, .links a:focus-visible::before, .links a:focus-visible::after { opacity: 1; }
.links .soon { color: var(--faint); cursor: default; }
.links sup { font-size: 7px; letter-spacing: 0.14em; margin-left: 4px; vertical-align: 5px; }
@media (max-width: 699px) { .top { flex-wrap: nowrap; gap: 12px; } .links { gap: 12px; } .links a, .links .soon { font-size: 9.5px; letter-spacing: 0.16em; } .links sup { display: none; } .links .soon { text-decoration: line-through; text-decoration-color: var(--faint); } .brand { gap: 8px; } .name { letter-spacing: 0.24em; } }
.typed {
  margin: 0; font-size: 13px; line-height: 1.75; letter-spacing: 0.01em;
  min-height: calc(3 * 1.75em); min-width: 0; max-width: 40ch;
}
.typed span { display: block; white-space: pre; }
.typed span.old { color: var(--dim); }
.left { display: grid; gap: 6px; min-width: 0; }
.caret { display: inline-block; width: 0.55em; height: 1.05em; vertical-align: -0.18em; background: var(--ink); margin-left: 1px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.right { display: grid; gap: 10px; justify-items: end; text-align: right; }
.hint { transition: opacity 2.4s ease; }
.hint.gone { opacity: 0; }
@media (max-width: 699px) {
  .typed { font-size: 12px; }
  .bottom { flex-direction: column; align-items: flex-start; gap: 14px; }
  .right { justify-items: start; text-align: left; }
  .bottom { margin-inline: -16px; padding-inline: 16px; padding-top: 40px; background: linear-gradient(to bottom, transparent, rgba(6, 7, 7, 0.88) 38%); }
}
@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  .hint { transition: none; }
}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<div class="hud">
  <header class="row top">
    <div class="brand">
      <span class="label name" id="name"></span>
    </div>
    <nav class="links" id="links" aria-label="Links"></nav>
  </header>
  <div></div>
  <div class="row bottom">
    <h1 class="sr-only" id="quiet"></h1>
    <div class="left">
      <p class="typed" id="typed" aria-live="off"></p>
    </div>
    <div class="right">
      <span class="label faint" id="status"></span>
      <span class="label faint hint" id="hint"></span>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────────────────── copy: edit freely ───────────────────────── */
const COPY = {
  name:   'replume',
  status: 'pre-launch · 2026',
  // href: null shows the link greyed out with "soon"
  links: [
    { label: 'research', href: null },
    { label: 'linkedin', href: 'https://www.linkedin.com/in/rafael-ibayev-17889b334/' },
    { label: 'x', href: 'https://x.com/rafaelibayev' },
  ],
  labels: ['[ human ]', '[ machine ]'],
  // each group is typed, held, erased, then the next group follows (loops)
  typed: [
    ['we believe in the human touch.', 'in the machine\u2019s reach.', 'and in what they build together.'],
    ['a thought is a signal.', 'a signal can be read.', 'we are learning to listen.'],
    ['no wires through the skin.', 'only what the body already says.', 'made reliable.'],
  ],
  holdSeconds: 9,
  // heading for screen readers and search only, not shown
  quiet:  'replume: human and machine, reaching for each other',
  hint:   'hold to bring them together · type to speak',
  hintTouch: 'hold to bring them together',
};

/* ───────────────────────── tuning ───────────────────────── */
const TUNE = {
  ink: '#e9e7e2',
  bg: '#060707',
  cursorRadius: 95,      // px around the pointer that reacts
  heatDecay: 0.952,      // per frame; closer to 1 = glyphs settle slower
  pulseSeconds: 2.8,     // time for a click pulse to cross the gap
  typedSeconds: 3.4,     // time for a typed key to cross the gap
  dustPerCell: 1 / 80,
};

const FONT = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const HUM_RAMP = " .'`,:;-~=+*o";
const ROB_H = ".:-==";   // metal fill when the link runs across the screen
const ROB_V = ".:!||";   // metal fill when the link runs up and down
const SCRAMBLE = "01<>/\\|-+=*:;~^#%?!";
const GHOST = ".,:'`.";
const DUST = ".·`',.:";

/* ───────────────────────── text ───────────────────────── */
document.getElementById('name').textContent = COPY.name;
{
  const nav = document.getElementById('links');
  COPY.links.forEach((l) => {
    let el;
    if (l.href) { el = document.createElement('a'); el.href = l.href; el.target = '_blank'; el.rel = 'noopener'; el.textContent = l.label; }
    else { el = document.createElement('span'); el.className = 'soon'; el.textContent = l.label; el.title = 'soon'; const s = document.createElement('sup'); s.textContent = 'soon'; el.appendChild(s); }
    nav.appendChild(el);
  });
}
document.getElementById('status').textContent = COPY.status;
document.getElementById('quiet').textContent = COPY.quiet;
const hintEl = document.getElementById('hint');
hintEl.textContent = matchMedia('(hover: none)').matches ? COPY.hintTouch : COPY.hint;
const typedEl = document.getElementById('typed');
typedEl.setAttribute('aria-label', COPY.typed.map((g) => g.join(' ')).join(' '));

const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let RM = reduceMQ.matches;

let twToken = 0;
function typewriter() {
  const my = ++twToken;
  const alive = () => my === twToken;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  typedEl.textContent = '';
  const caret = document.createElement('i');
  caret.className = 'caret';
  if (RM) {
    COPY.typed[0].forEach((l, i, arr) => {
      const sp = document.createElement('span');
      sp.textContent = l;
      if (i < arr.length - 1) sp.className = 'old';
      typedEl.appendChild(sp);
    });
    typedEl.lastChild.appendChild(caret);
    return;
  }
  const lineEl = () => { const sp = document.createElement('span'); typedEl.appendChild(sp); return sp; };
  (async () => {
    await wait(1200);
    for (let g = 0; alive(); g = (g + 1) % COPY.typed.length) {
      const lines = COPY.typed[g], spans = [];
      for (let li = 0; li < lines.length && alive(); li++) {
        const sp = lineEl(); spans.push(sp);
        const line = lines[li];
        for (let ci = 1; ci <= line.length && alive(); ci++) {
          sp.textContent = line.slice(0, ci); sp.appendChild(caret);
          const ch = line[ci - 1];
          await wait(48 + Math.random() * 46 + (ch === ' ' ? 40 : 0) + (ch === ',' || ch === '.' ? 260 : 0));
        }
        if (li < lines.length - 1) { await wait(1000); sp.className = 'old'; }
      }
      await wait(COPY.holdSeconds * 1000);
      // erase, last line first, like holding backspace
      for (let li = spans.length - 1; li >= 0 && alive(); li--) {
        const sp = spans[li]; sp.className = '';
        let txt = sp.textContent;
        while (txt.length && alive()) { txt = txt.slice(0, -1); sp.textContent = txt; sp.appendChild(caret); await wait(22); }
        if (li > 0) { sp.remove(); spans[li - 1].appendChild(caret); await wait(160); }
      }
      if (!alive()) return;
      await wait(900);
      typedEl.textContent = '';
    }
  })();
}

/* ───────────────────────── canvas + grid ───────────────────────── */
const cvs = document.getElementById('field');
const ctx = cvs.getContext('2d', { alpha: false });
let W = 0, H = 0, dpr = 1, fs = 11, cw = 7, chh = 13, cols = 0, rows = 0, N = 0;
let portrait = false, scale = 8, cx = 0, cy = 0;
let charBuf, briBuf, ownBuf, heat, hopX, hopY, ovCh, ovUntil;
let dust = [];
const GLYPH = new Map();
const glyph = (c) => { let s = GLYPH.get(c); if (!s) { s = String.fromCharCode(c); GLYPH.set(c, s); } return s; };
const code = (s) => s.charCodeAt(0);

function toScreen(sx, sy) { return portrait ? [cx - sy * scale, cy + sx * scale] : [cx + sx * scale, cy + sy * scale]; }
function toScene(X, Y) { return portrait ? [(Y - cy) / scale, -(X - cx) / scale] : [(X - cx) / scale, (Y - cy) / scale]; }
function dirScreen(x, y) { return portrait ? [-y, x] : [x, y]; }

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  portrait = H > W * 1.05;
  fs = W < 700 ? 7 : Math.max(8, Math.min(10, Math.round(W / 180)));
  { const q = new URLSearchParams(location.search).get('fs'); if (q) fs = +q; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = fs + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  cw = ctx.measureText('M').width || fs * 0.6;
  chh = Math.round(fs * 1.08);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chh); N = cols * rows;
  charBuf = new Uint16Array(N); briBuf = new Float32Array(N); ownBuf = new Uint8Array(N);
  heat = new Float32Array(N); hopX = new Float32Array(N); hopY = new Float32Array(N);
  ovCh = new Uint16Array(N); ovUntil = new Float64Array(N);
  if (portrait) { scale = Math.min(W / 42, H / 100); cx = W / 2; cy = H * 0.4; }
  else { scale = Math.min(W / 94, H / 52); cx = W / 2; cy = H * 0.45; }
  initDust();
  needsDraw = true;
}

function initDust() {
  const n = Math.round(N * TUNE.dustPerCell);
  dust = [];
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    dust.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 3.5, vy: -(0.9 + Math.random() * 3),
      ph: Math.random() * TAU, a: 0.04 + r * r * 0.22,
      c: code(DUST[(Math.random() * DUST.length) | 0]),
    });
  }
}

/* ───────────────────────── shapes (signed distance) ───────────────────────── */
function smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }

function cap(a, b, ra, rb) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  return { t: 0, ax: a[0], ay: a[1], dx, dy, l2: dx * dx + dy * dy || 1e-6, ra, rb, R: Math.max(ra, rb), _h: 0 };
}
function box(a, b, hw, rr, role) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1e-6;
  return { t: 1, ax: a[0], ay: a[1], bx: b[0], by: b[1], dx, dy, len, ux: dx / len, uy: dy / len, hw, rr, R: hw, role: role || 'link', _u: 0 };
}
function ring(p, r) { return { t: 2, ax: p[0], ay: p[1], bx: p[0], by: p[1], r, R: r, role: 'joint' }; }

function evalSeg(s, px, py) {
  const pax = px - s.ax, pay = py - s.ay;
  if (s.t === 0) {
    let h = (pax * s.dx + pay * s.dy) / s.l2; h = h < 0 ? 0 : h > 1 ? 1 : h;
    s._h = h;
    const qx = pax - s.dx * h, qy = pay - s.dy * h;
    return Math.sqrt(qx * qx + qy * qy) - (s.ra + (s.rb - s.ra) * h);
  }
  if (s.t === 1) {
    const u = pax * s.ux + pay * s.uy, v = -pax * s.uy + pay * s.ux;
    s._u = u; s._v = v;
    const qx = Math.abs(u - s.len / 2) - (s.len / 2 - s.rr), qy = Math.abs(v) - (s.hw - s.rr);
    const ox = qx > 0 ? qx : 0, oy = qy > 0 ? qy : 0;
    return Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(qx, qy), 0) - s.rr;
  }
  return Math.sqrt(pax * pax + pay * pay) - s.r;
}

function makePart(kind, segs, k, z) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const s of segs) {
    const bx = s.t === 0 ? s.ax + s.dx : s.bx, by = s.t === 0 ? s.ay + s.dy : s.by, r = s.R + 0.5;
    x0 = Math.min(x0, s.ax - r, bx - r); x1 = Math.max(x1, s.ax + r, bx + r);
    y0 = Math.min(y0, s.ay - r, by - r); y1 = Math.max(y1, s.ay + r, by + r);
  }
  return { kind, segs, k, z, x0, y0, x1, y1, near: 0 };
}
function partDist(p, x, y) {
  let d = 1e9, best = 1e9, bi = 0;
  const segs = p.segs;
  for (let i = 0; i < segs.length; i++) {
    const di = evalSeg(segs[i], x, y);
    if (di < best) { best = di; bi = i; }
    d = (p.k > 0 && i > 0) ? smin(d, di, p.k) : Math.min(d, di);
  }
  p.near = bi;
  return d;
}

/* ───────────────────────── the two hands ───────────────────────── */
// Drawn from scratch: a wrist at the origin, the hand points along +x, y is down.
// b = knuckle, a = base angle, c = bend at each joint (deg), L = bone lengths, r0/r1 = thickness.
const HUMAN = {
  wristBend: 22,
  fingers: [
    { b: [12.3, 2.0], a: 8, c: [56, 52, 38], L: [5.6, 3.6, 2.8], r0: 1.42, r1: 1.12 },
    { b: [13.4, 0.8], a: 4, c: [46, 52, 40], L: [6.8, 4.3, 3.2], r0: 1.55, r1: 1.2 },
    { b: [14.0, -0.5], a: 0, c: [34, 50, 40], L: [7.2, 4.6, 3.4], r0: 1.62, r1: 1.25 },
    { b: [13.8, -2.0], a: -22, c: [3, 7, 8], L: [8.4, 5.3, 3.9], r0: 1.62, r1: 1.24 },
  ],
  thumb: { b: [3.0, 2.6], a: 30, c: [0, -26, -14], L: [6.0, 4.6, 3.4], r0: 1.95, r1: 1.35 },
};
const ROBOT = {
  wristBend: 8,
  fingers: [
    { b: [12.5, 2.0], a: 8, c: [46, 40, 28], L: [5.6, 3.6, 2.8], r0: 1.38, r1: 1.15 },
    { b: [13.6, 0.8], a: 4, c: [36, 40, 28], L: [6.8, 4.3, 3.2], r0: 1.48, r1: 1.22 },
    { b: [14.2, -0.5], a: 0, c: [26, 36, 26], L: [7.2, 4.6, 3.4], r0: 1.52, r1: 1.25 },
    { b: [14.0, -2.0], a: -6, c: [2, 2, 2], L: [8.4, 5.3, 3.9], r0: 1.52, r1: 1.24 },
  ],
  thumb: { b: [3.4, 2.6], a: 28, c: [0, -22, -10], L: [6.0, 4.6, 3.4], r0: 1.8, r1: 1.32 },
};

function makeXf(W0, th, m, fy) {
  const c = Math.cos(th), s = Math.sin(th), f = fy || 1;
  return (p) => { const y = p[1] * f; return [W0[0] + m * (p[0] * c - y * s), W0[1] + (p[0] * s + y * c)]; };
}
function chainPts(f, bend) {
  const pts = [[f.b[0], f.b[1]]], dirs = [];
  let a = f.a, x = f.b[0], y = f.b[1];
  for (let i = 0; i < f.L.length; i++) {
    a += f.c[i] * bend[i];
    const r = a * D2R;
    x += Math.cos(r) * f.L[i]; y += Math.sin(r) * f.L[i];
    pts.push([x, y]); dirs.push(r);
  }
  return { pts, dirs };
}
const lerp = (a, b, t) => a + (b - a) * t;

function humanFinger(xf, f, bend, z) {
  const { pts, dirs } = chainPts(f, bend);
  const n = f.L.length, segs = [];
  for (let i = 0; i < n; i++) segs.push(cap(xf(pts[i]), xf(pts[i + 1]), lerp(f.r0, f.r1, i / n), lerp(f.r0, f.r1, (i + 1) / n)));
  const e = pts[n], d = dirs[n - 1];
  return { part: makePart('h', segs, 0.7, z), tip: xf([e[0] + Math.cos(d) * f.r1 * 1.1, e[1] + Math.sin(d) * f.r1 * 1.1]) };
}
function robotFinger(xf, f, bend, z) {
  const { pts, dirs } = chainPts(f, bend);
  const n = f.L.length, segs = [];
  for (let i = 0; i < n; i++) {
    const hw = lerp(f.r0, f.r1, i / n) * 0.95, jr = hw * 0.92;
    segs.push(ring(xf(pts[i]), jr));
    const d = dirs[i], ux = Math.cos(d), uy = Math.sin(d);
    const s0 = jr * 0.55, s1 = i < n - 1 ? lerp(f.r0, f.r1, (i + 1) / n) * 0.5 : -hw * 0.2;
    const a = [pts[i][0] + ux * s0, pts[i][1] + uy * s0];
    const b = [pts[i + 1][0] - ux * s1, pts[i + 1][1] - uy * s1];
    segs.push(box(xf(a), xf(b), hw, i === n - 1 ? hw * 0.75 : 0.3, 'link'));
  }
  const e = pts[n], d = dirs[n - 1];
  return { part: makePart('r', segs, 0, z), tip: xf([e[0] + Math.cos(d) * f.r1 * 0.5, e[1] + Math.sin(d) * f.r1 * 0.5]) };
}

let humanTip = [0, 0], robotTip = [0, 0], humanLabel = [0, 0], robotLabel = [0, 0];
// hold: 0..1, how far the two hands have been drawn together. aimH / aimR: small tilt (deg).
function buildHands(t, twitch, hold, aimH, aimR) {
  const parts = [];
  const ease = hold * hold * (3 - 2 * hold);
  // human, from the upper left, hand hanging down off the wrist
  const br = Math.sin(t * 0.42), reach = Math.sin(t * 0.16);
  const hDir = [0.91, 0.41];
  const hW = [-37.5 + reach * 1.4 + hDir[0] * ease * 6.5, -16.5 + br * 0.8 + hDir[1] * ease * 6.5];
  const hTh = (10 + br * 1.4 + aimH) * D2R;
  const ax = makeXf(hW, hTh, 1);
  const hx = makeXf(hW, hTh + (HUMAN.wristBend + br * 2) * D2R, 1);
  parts.push(makePart('h', [
    cap(ax([0, 0]), ax([-24, 0.8]), 3.9, 4.9),
    cap(ax([-24, 0.8]), ax([-60, 3.5]), 4.9, 6.2),
    cap(ax([-60, 3.5]), ax([-130, -2]), 6.4, 7.6),
    cap(hx([0.5, 0.0]), hx([13.4, -0.4]), 4.3, 3.7),
    cap(hx([1.0, 1.5]), hx([9.0, 1.8]), 3.6, 3.2),
  ], 3.0, 9));
  HUMAN.fingers.forEach((f, i) => {
    const fl = Math.sin(t * 0.55 + i * 0.8);
    const k = i === 3 ? (1 + 0.45 * fl) * (1 - 0.7 * ease) : 1 + 0.14 * fl;
    const r = humanFinger(hx, f, [k, k, k], 2 + i);
    parts.push(r.part);
    if (i === 3) humanTip = r.tip;
  });
  { const fl = Math.sin(t * 0.48 + 2.1); parts.push(humanFinger(hx, HUMAN.thumb, [1, 1 + 0.2 * fl, 1 + 0.2 * fl], 1.5).part); }
  humanLabel = ax([-9, -8.5]);

  // machine, from the lower right, palm turned up, fingers curling upward

/* ───────────────────────── state ───────────────────────── */
const pointer = { x: -1e4, y: -1e4, active: false, speed: 0, lt: 0 };
let pulses = [], typedGlyphs = [];

let holding = false, hold = 0, touched = false, aimH = 0, aimR = 0;
let echoGlyphs = [], touchWave = -1, touchAt = [0, 0];

let holdBase = 0;

const aimHist = [];
let t = 7.3, last = performance.now(), needsDraw = true;

function put(i, c, b, own) {

}
function putXY(X, Y, c, b, own) {

function lineChar(dx, dy, analog) {

/* ───────────────────────── frame ───────────────────────── */
function analogWave(s, tt) {
  return Math.sin(s * 15 - tt * 1.9) * 0.62 + Math.sin(s * 33 + tt * 1.2) * 0.28 + Math.sin(s * 61 - tt * 3.1) * 0.12;
}

function render(now) {
  charBuf.fill(0); briBuf.fill(0); ownBuf.fill(0);
  const parts = buildHands(t, twitch, hold, aimH, aimR);
  const G = [(humanTip[0] + robotTip[0]) / 2, (humanTip[1] + robotTip[1]) / 2];
  const LI = (1.2 + 0.14 * Math.sin(t * 0.5)) * (1 + flash * 0.25);

  // dust, lit a little more inside the glow between the hands
  const Gs = toScreen(G[0], G[1]);
  for (const p of dust) {
    const col = Math.floor(p.x / cw), row = Math.floor(p.y / chh);
    if (col < 0 || row < 0 || col >= cols || row >= rows) continue;
    const dx = (p.x - Gs[0]) / (scale * 40), dy = (p.y - Gs[1]) / (scale * 40);
    const near = 1 / (1 + (dx * dx + dy * dy) * 3);
    const tw = RM ? 1 : 0.6 + 0.4 * Math.sin(t * 0.9 + p.ph);
    put(row * cols + col, p.c, p.a * tw * (1 + 2.2 * near), 1);
  }

  // hands
  const eW = (cw / scale) * 0.62;
  const e = 0.22;
  for (let row = 0; row < rows; row++) {
    const Y = (row + 0.5) * chh;
    for (let col = 0; col < cols; col++) {
      const X = (col + 0.5) * cw;
      const sc = toScene(X, Y), sx = sc[0], sy = sc[1];
      let hit = null, d = 0;
      for (let k = 0; k < parts.length; k++) {
        const p = parts[k];
        if (sx < p.x0 || sx > p.x1 || sy < p.y0 || sy > p.y1) continue;
        const dd = partDist(p, sx, sy);
        if (dd < 0) { hit = p; d = dd; break; }
      }
      if (!hit) continue;
      const seg = hit.segs[hit.near];
      const segH = seg._h, segU = seg._u, segV = seg._v;
      let gx = partDist(hit, sx + e, sy) - d, gy = partDist(hit, sx, sy + e) - d;
      const gl = Math.hypot(gx, gy) || 1; gx /= gl; gy /= gl;
      const robot = hit.kind === 'r';
      const R = seg.t === 0 ? seg.ra + (seg.rb - seg.ra) * segH : seg.t === 1 ? seg.hw : seg.r;
      const depth = Math.min(1, -d / R);
      const lat = 1 - depth, nz = Math.sqrt(Math.max(0, 1 - lat * lat));

      const dist = Math.hypot(Lx, Ly);

      const ll = Math.hypot(lx, ly, lz); lx /= ll; ly /= ll; lz /= ll;

      const ns = dirScreen(gx, gy);
      let c;
      const i = row * cols + col;
      if (-d < eW) {
        const rim = Math.max(0, gx * Lx + gy * Ly);

        c = edgeChar(ns[0], ns[1], robot);
      } else if (!robot) {

        const cxs = sx - seg.ax, cys = sy - seg.ay;

function label(at, text) {
  const P = toScreen(at[0], at[1]);
  const x0 = P[0] - (text.length / 2) * cw;
  for (let k = 0; k < text.length; k++) {
    const ch = text.charCodeAt(k);

const LEVELS = 18;
const bucket = Array.from({ length: LEVELS }, () => []);
function draw(now) {
  ctx.fillStyle = TUNE.bg;
  ctx.fillRect(0, 0, W, H);
  for (const b of bucket) b.length = 0;
  for (let i = 0; i < N; i++) {
    let c = charBuf[i], b = briBuf[i];
    const h = heat[i];
    let ox = 0, oy = 0;
    if (h > 0.02) {
      if (!RM) {
        if (ovUntil[i] > now) { if (c) c = ovCh[i]; }
        else if (c && h > 0.2 && Math.random() < 0.09 * h) {
          ovCh[i] = code(SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0]);
          ovUntil[i] = now + 110 + Math.random() * 260;
          c = ovCh[i];
        }
        const step = Math.round(h * 2.4) * 0.5;
        ox = step * cw * hopX[i]; oy = step * chh * hopY[i];
      }
      if (!c) { if (h > 0.14) { c = code(GHOST[i % GHOST.length]); b = h * 0.32; } }
      else b = Math.min(1, b + h * 0.6);
    }
    if (!c || b < 0.025) continue;
    const lv = Math.min(LEVELS - 1, Math.floor(b * LEVELS));
    const col = i % cols, row = (i / cols) | 0;

  }
  ctx.fillStyle = TUNE.ink;
  for (let lv = 0; lv < LEVELS; lv++) {
    const arr = bucket[lv];
    if (!arr.length) continue;
    ctx.globalAlpha = Math.pow((lv + 0.6) / LEVELS, 1.05);
    for (let j = 0; j < arr.length; j += 3) ctx.fillText(glyph(arr[j + 2]), arr[j], arr[j + 1]);
  }
  ctx.globalAlpha = 1;
}

function stepSim(dt, now) {
  if (!RM) {
    t += dt;
    for (const p of dust) {
      p.x += (p.vx + Math.sin(t * 0.21 + p.ph) * 2.2) * dt;
      p.y += p.vy * dt;
      if (p.y < -10) { p.y = H + 5; p.x = Math.random() * W; }

  }

  for (const p of pulses) {
    p.s += dt / TUNE.pulseSeconds;

  }

    }

    if (g.delay > 0) { g.delay -= dt; continue; }

    if (g.s <= 0 && !g.done) { g.done = true; humanGlow = Math.min(1.2, humanGlow + 0.3); }

function excite(x, y, R, strength) {
  const c0 = Math.max(0, Math.floor((x - R) / cw)), c1 = Math.min(cols - 1, Math.ceil((x + R) / cw));

function loop(now) {

  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  stepSim(dt, now);
  render(now);
}

/* ───────────────────────── input ───────────────────────── */
let hintTimer = setTimeout(() => hintEl.classList.add('gone'), 14000);
function hideHint() { hintEl.classList.add('gone'); clearTimeout(hintTimer); }

window.addEventListener('pointermove', (ev) => {
  const now = performance.now();
  const dtm = Math.max(8, now - (pointer.lt || now - 16));
  if (pointer.active) {
    const v = Math.hypot(ev.clientX - pointer.x, ev.clientY - pointer.y) / (dtm / 1000);
    pointer.speed = Math.max(pointer.speed, Math.min(2000, v));
  }
  pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.lt = now; pointer.active = true;
}, { passive: true });
window.addEventListener('pointerdown', (ev) => {
  pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.active = true;
